function homeScreen(){const openTasks=state.tasks.filter(t=>!t.done),todayEvents=state.events.filter(e=>e.date===C.dateKey()).sort((a,b)=>a.time.localeCompare(b.time)),hour=new Date().getHours();const greeting=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';return `<div class="home-top"><div><div class="eyebrow">Your small home</div><h1>PocketDesk</h1></div><button class="icon-button" data-action="quick" aria-label="Quick settings">${icon('settings')}</button></div><div class="home-columns"><div><div class="clock-widget"><div class="time" id="home-clock">${timeNow()}</div><div class="date" id="home-date">${dateLabel(C.dateKey(),true)}</div><div class="hello">${icon('sun')}<span>${greeting}, ${esc(state.settings.name)}</span></div></div><div class="card day-card"><div class="card-top"><h2>Your day</h2><span class="pill">${openTasks.length} open ${openTasks.length===1?'task':'tasks'}</span></div><button class="day-line" data-action="app" data-id="calendar">${icon('calendar')}<span><strong>${todayEvents.length?esc(todayEvents[0].title):'A clear day ahead'}</strong><small>${todayEvents.length?esc((todayEvents[0].time||'All day')+(todayEvents.length>1?` · ${todayEvents.length} plans today`:'')):'Add a plan to your calendar'}</small></span>${icon('chevron','chevron')}</button><button class="day-line" data-action="app" data-id="tasks">${icon('tasks')}<span><strong>${openTasks.length?esc(openTasks[0].title):'One thing at a time'}</strong><small>${openTasks.length?'Open your to-do list':'Make a small to-do list'}</small></span>${icon('chevron','chevron')}</button></div></div><div><button class="home-search" data-action="search">${icon('search')}<span>Find an app, note, or contact</span></button><div class="section-row"><h2>Your apps</h2><button class="text-button" data-action="favorites">Choose apps</button></div><div class="app-grid">${state.favorites.map(id=>appById(id)).filter(Boolean).map(a=>tile(a)).join('')}</div><div class="dock"><div class="app-grid">${tile(appById('phone'))}${tile(appById('messages'))}<button class="app-tile" data-action="apps" aria-label="All apps"><span class="tile-icon allapps-icon">${icon('grid')}</span><span class="app-label">All apps</span></button>${tile(appById('camera'))}</div></div></div></div>`;}
function appsScreen(){if(view.appsTab==='phone'&&N&&!phoneApps.length){try{phoneApps=JSON.parse(N.installedApps());}catch(_){phoneApps=[];}}return header('All apps','Everything in one place','grid')+`<div class="tabs"><button data-action="apps-tab" data-value="pocket" class="${view.appsTab==='pocket'?'active':''}">Pocket apps</button><button data-action="apps-tab" data-value="phone" class="${view.appsTab==='phone'?'active':''}">Phone apps</button></div>${searchField('apps-search','Find an app')}<div id="apps-results">${appResults('')}</div>`;}
function appResults(query){const q=query.toLowerCase().trim();if(view.appsTab==='phone'){if(!N)return empty('device','Your installed apps','In the Android app, this page shows the apps installed on your phone.');const list=phoneApps.filter(a=>a.name.toLowerCase().includes(q));return list.length?`<div class="list">${list.map(a=>`<button class="list-item" data-action="launch-package" data-id="${esc(a.package)}">${a.icon?`<img src="${esc(a.icon)}" alt="">`:`<span class="list-icon">${icon('grid')}</span>`}<span class="grow"><strong>${esc(a.name)}</strong><small>Open on your phone</small></span>${icon('chevron','chevron')}</button>`).join('')}</div>`:empty('search','No apps found','Try another name.');}const found=apps.filter(a=>(a.name+' '+a.hint).toLowerCase().includes(q));return found.length?`<div class="app-grid">${found.map(a=>tile(a)).join('')}</div>`:empty('search','No apps found','Try another name.');}
function notesScreen(){return header('Notes','Ideas, lists, and little reminders','notes')+`<div class="row spread"><div class="tabs grow"><button data-action="notes-tab" data-value="active" class="${view.notesTab==='active'?'active':''}">My notes</button><button data-action="notes-tab" data-value="trash" class="${view.notesTab==='trash'?'active':''}">Trash</button></div><button class="icon-button" data-action="new-note" aria-label="New note">${icon('plus')}</button></div>${searchField('notes-search','Find a note')}<div id="notes-results">${noteResults('')}</div>`;}
function noteResults(query){const q=query.toLowerCase().trim(),list=state.notes.filter(n=>n.deleted===(view.notesTab==='trash')&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updated-a.updated);return list.length?`<div class="note-grid">${list.map(n=>`<button class="note-card" data-action="open-note" data-id="${n.id}" style="--note-color:${colors[n.color][0]}">${n.pinned?icon('pin','pin'):''}<h2>${esc(n.title||'Untitled note')}</h2><p>${esc(n.body||'No text yet')}</p><small>${new Date(n.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</small></button>`).join('')}</div>`:empty('notes',q?'No matching notes':view.notesTab==='trash'?'Your trash is empty':'A place for your ideas',q?'Try another word.':view.notesTab==='trash'?'Deleted notes will appear here.':'Write a note. It saves as you type.',view.notesTab==='active'&&!q?'New note':'','new-note');}
function noteScreen(){const n=state.notes.find(n=>n.id===current.params.id);if(!n)return empty('notes','Note not found','Go back to your notes.');return header(n.deleted?'Deleted note':'Your note','Saved on this phone','notes')+`<div class="content-narrow"><div class="note-toolbar"><div class="swatches">${Object.keys(colors).filter(k=>k!=='yellow').map(k=>`<button class="swatch ${n.color===k?'selected':''}" style="background:${colors[k][0]}" data-action="note-color" data-value="${k}" aria-label="${k} note"></button>`).join('')}</div><button class="secondary" data-action="pin-note">${icon('pin')}${n.pinned?'Unpin':'Pin'}</button></div><div class="card"><label class="field"><span class="label">Title</span><input id="note-title" class="note-title" value="${esc(n.title)}" maxlength="150" placeholder="Untitled note" ${n.deleted?'readonly':''}></label><label><span class="label">Your note</span><textarea id="note-body" class="note-body" maxlength="50000" placeholder="Start writing here…" ${n.deleted?'readonly':''}>${esc(n.body)}</textarea></label><div class="editor-status" id="save-status">${storageError?'Not saved — check storage':'Saved on this phone'}</div></div><div class="row wrap gap">${n.deleted?`<button class="primary" data-action="restore-note">${icon('undo')}Restore note</button><button class="danger" data-action="delete-note-forever">${icon('trash')}Delete forever</button>`:`<button class="secondary" data-action="export-note">${icon('download')}Save as a text file</button><button class="secondary" data-action="trash-note">${icon('trash')}Move to trash</button>`}</div></div>`;}
function tasksScreen(){const done=state.tasks.filter(t=>t.done).length;return header('Tasks','Small steps for your day','tasks')+`<div class="row spread"><div class="tabs grow"><button data-action="tasks-tab" data-value="open" class="${view.tasksTab==='open'?'active':''}">Open</button><button data-action="tasks-tab" data-value="done" class="${view.tasksTab==='done'?'active':''}">Done (${done})</button></div><button class="icon-button" data-action="new-task" aria-label="Add task">${icon('plus')}</button></div><div id="tasks-results">${taskResults()}</div>`;}
function taskResults(){const today=C.dateKey(),list=state.tasks.filter(t=>t.done===(view.tasksTab==='done')).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return list.length?`<div class="list">${list.map(t=>`<div class="list-item task-row ${t.done?'completed':''}"><button class="task-check ${t.done?'done':''}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.done?'Mark open':'Mark done'}: ${esc(t.title)}"><span class="box">${t.done?icon('check'):''}</span></button><button class="grow" style="text-align:left" data-action="edit-task" data-id="${t.id}"><strong>${esc(t.title)}</strong><small class="${t.due&&t.due<today&&!t.done?'late':''}">${t.due?dateLabel(t.due)+(t.due<today&&!t.done?' · Overdue':''):'No due date'}</small></button><button class="icon-button" data-action="edit-task" data-id="${t.id}" aria-label="Edit task">${icon('edit')}</button></div>`).join('')}</div>`:empty('tasks',view.tasksTab==='done'?'Your finished tasks appear here':'What is your next small step?',view.tasksTab==='done'?'Tap the box beside a task when you finish it.':'Add one task. You can choose a due date.','Add task','new-task');}
function calendarScreen(){const cells=C.monthCells(view.year,view.month),today=C.dateKey(),events=state.events.filter(e=>e.date===view.selectedDate).sort((a,b)=>a.time.localeCompare(b.time));return header('Calendar','Your plans, saved here','calendar')+`<div class="content-narrow"><div class="card"><div class="calendar-top"><button class="icon-button" data-action="calendar-prev" aria-label="Previous month">${icon('back')}</button><h2>${new Date(view.year,view.month,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><button class="icon-button" data-action="calendar-next" aria-label="Next month">${icon('chevron')}</button></div><div class="weekdays">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div><div class="month-grid">${cells.map(d=>`<button data-action="calendar-day" data-value="${d.date}" aria-label="${dateLabel(d.date,true)}" aria-pressed="${d.date===view.selectedDate}" class="day ${d.inMonth?'':'outside'} ${d.date===today?'today':''} ${d.date===view.selectedDate?'selected':''}"><span>${d.day}</span><span class="dot ${state.events.some(e=>e.date===d.date)?'':'blank'}"></span></button>`).join('')}</div><button class="text-button" data-action="calendar-today">Go to today</button></div><div class="section-row"><h2>${dateLabel(view.selectedDate,true)}</h2><button class="primary" data-action="new-event">${icon('plus')}Add plan</button></div>${events.length?`<div class="list">${events.map(e=>listItem('calendar',e.title,(e.time||'All day')+(e.place?' · '+e.place:''),'open-event',e.id)).join('')}</div>`:empty('calendar','No plans for this day','Tap Add plan to save something here.')}<p class="kbd-hint">These plans stay in PocketDesk. Use your phone’s calendar for automatic reminders.</p><button class="secondary" data-action="system" data-id="calendar">${icon('bell')}Open phone calendar</button></div>`;}
function eventScreen(){const e=state.events.find(x=>x.id===current.params.id);if(!e)return empty('calendar','Plan not found','Go back to the calendar.');return header('Your plan','','calendar')+`<div class="content-narrow stack"><div class="card"><h2>${esc(e.title)}</h2><p class="gap">${dateLabel(e.date,true)} · ${esc(e.time||'All day')}</p>${e.place?`<p class="gap">${esc(e.place)}</p>`:''}${e.details?`<p class="gap detail-text">${esc(e.details)}</p>`:''}</div><div class="row"><button class="primary" data-action="edit-event" data-id="${e.id}">${icon('edit')}Edit plan</button><button class="secondary" data-action="delete-event" data-id="${e.id}">${icon('trash')}Delete</button></div></div>`;}
function clockScreen(){let content='';const tabs=[['time','Time'],['stopwatch','Stopwatch'],['timer','Timer']];if(view.clockTab==='time'){content=`<div class="clock-face"><div class="clock-ring"><div class="clock-hand hour" id="hour-hand"></div><div class="clock-hand" id="minute-hand"></div><div class="clock-center"></div></div><div class="big-time" id="clock-time">${timeNow()}</div><p>${dateLabel(C.dateKey(),true)}</p></div><div class="list">${[['Vienna','Europe/Vienna'],['Seoul','Asia/Seoul'],['London','Europe/London'],['New York','America/New_York']].map(([name,zone])=>`<div class="list-item"><span class="grow"><strong>${name}</strong><small id="world-date-${zone.replace(/\W/g,'')}">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:zone})}</small></span><span class="world-time" data-zone="${zone}">${timeNow(zone)}</span></div>`).join('')}</div><button class="primary full gap" data-action="alarm-form">${icon('bell')}Set a phone alarm</button>`;}else if(view.clockTab==='stopwatch'){const w=state.stopwatch;content=`<div class="clock-face"><div id="stopwatch-time" class="big-time">${C.duration(stopwatchElapsed(),true)}</div><p>${w.running?'Running':'Ready when you are'}</p></div><div class="row"><button class="primary grow" data-action="stopwatch-toggle">${icon(w.running?'pause':'play')}${w.running?'Pause':'Start'}</button><button class="secondary" data-action="stopwatch-lap" ${w.running?'':'disabled'}>Lap</button><button class="secondary" data-action="stopwatch-reset">Reset</button></div><div class="list gap">${w.laps.map((l,i)=>`<div class="list-item"><strong class="grow">Lap ${w.laps.length-i}</strong><span class="media-time">${C.duration(l,true)}</span></div>`).join('')}</div>`;}else{const t=state.timer;content=`<div class="clock-face"><div class="big-time" id="timer-time">${C.duration(timerRemaining())}</div><p>${t.running?'Counting down':t.remaining?'Paused':'Choose a time'}</p></div>${!t.running&&!t.remaining?`<div class="form-grid"><label class="field"><span class="label">Minutes</span><input type="number" id="timer-minutes" class="timer-input" min="0" max="1440" value="5" inputmode="numeric"></label><label class="field"><span class="label">Seconds</span><input type="number" id="timer-seconds" class="timer-input" min="0" max="59" value="0" inputmode="numeric"></label></div>`:''}<div class="row gap"><button class="primary grow" data-action="timer-toggle">${icon(t.running?'pause':'play')}${t.running?'Pause':t.remaining?'Continue':'Start'}</button><button class="secondary" data-action="timer-reset">Reset</button></div><div class="card gap"><h3>Need an alert in the background?</h3><p class="small gap">The PocketDesk timer alerts you while this app is open. Your phone’s timer can alert you after you close it.</p><button class="secondary full gap" data-action="phone-timer">${icon('bell')}Open phone timer</button></div>`;}return header('Clock','24-hour time, nice and clear','clock')+`<div class="content-narrow"><div class="tabs">${tabs.map(([id,name])=>`<button data-action="clock-tab" data-value="${id}" class="${view.clockTab===id?'active':''}">${name}</button>`).join('')}</div>${content}</div>`;}
function stopwatchElapsed(){const w=state.stopwatch;return w.elapsed+(w.running?Math.max(0,Date.now()-w.started):0);}
function timerRemaining(){return state.timer.running?Math.max(0,state.timer.end-Date.now()):state.timer.remaining;}
function stopwatchFrame(){const el=$('stopwatch-time');if(el)el.textContent=C.duration(stopwatchElapsed(),true);if(state.stopwatch.running&&current.id==='clock'&&view.clockTab==='stopwatch'&&!document.hidden)raf=requestAnimationFrame(stopwatchFrame);}
function calculatorScreen(){const keys=[['C','clear'],['(', '('],[')',')'],['⌫','erase'],['7','7'],['8','8'],['9','9'],['÷','/'],['4','4'],['5','5'],['6','6'],['×','*'],['1','1'],['2','2'],['3','3'],['−','-'],['%','%'],['0','0'],['.','.'],['+','+'],['±','sign'],['00','00'],['History','history'],['=','equals']];return header('Calculator','Numbers without the fuss','calculator')+`<div class="content-narrow"><div class="calc-display" role="status" aria-live="polite"><div class="calc-expression" id="calc-expression">${esc(view.calc.replace(/\*/g,'×').replace(/\//g,'÷')||'0')}</div><div class="calc-preview" id="calc-preview">${esc(view.calcError||calcPreview())}</div></div><div class="calc-grid">${keys.map(([label,value])=>`<button class="calc-key ${['/','*','-','+','%'].includes(value)?'op':''} ${value==='equals'?'equals':''}" data-action="calc-key" data-value="${value}" aria-label="${value==='erase'?'Delete last number':value==='equals'?'Equals':esc(label)}" ${value==='history'?'style="font-size:.74em"':''}>${label}</button>`).join('')}</div><p class="kbd-hint">% means divide by 100. For example: 200 × 10% = 20.</p></div>`;}
function calcPreview(){try{return view.calc&&!view.calcResult?'= '+C.calculate(view.calc):'';}catch(_){return '';}}
function calcKey(value){if(value==='history'){openSheet('Calculation history',state.calcHistory.length?`<div class="list">${state.calcHistory.map(h=>`<div class="list-item"><span class="grow"><small>${esc(h.expression)}</small><strong>${esc(h.result)}</strong></span></div>`).join('')}</div><button class="secondary full gap" data-action="clear-calc-history">Clear history</button>`:empty('calculator','No history yet','Your finished calculations appear here.'));return;}view.calcError='';if(value==='clear'){view.calc='';view.calcResult=false;}else if(value==='erase'){view.calc=view.calc.slice(0,-1);view.calcResult=false;}else if(value==='sign'){view.calc=view.calc.startsWith('-(')&&view.calc.endsWith(')')?view.calc.slice(2,-1):view.calc?'-('+view.calc+')':'-';view.calcResult=false;}else if(value==='equals'){try{const result=C.calculate(view.calc);state.calcHistory.unshift({expression:view.calc,result});state.calcHistory=state.calcHistory.slice(0,30);view.calc=result;view.calcResult=true;save();}catch(e){view.calcError=e.message;}}else{if(view.calcResult&&/[\d.(]/.test(value))view.calc='';view.calcResult=false;if(view.calc.length<190)view.calc+=value;}if($('calc-expression')){$('calc-expression').textContent=view.calc.replace(/\*/g,'×').replace(/\//g,'÷')||'0';$('calc-preview').textContent=view.calcError||calcPreview();}}
function filesScreen(){let files=[];try{files=N?JSON.parse(N.recentFiles()):[];}catch(_){}return header('Files','Open only the files you choose','files')+`<div class="content-narrow stack"><div class="card"><div class="row"><span class="badge-icon">${icon('files')}</span><div class="grow"><h2>Your files</h2><p class="small">Choose a file from your phone.</p></div></div><button class="primary full gap" data-action="pick-file">${icon('folder')}Choose a file</button></div><div class="card"><h2>Your PocketDesk data</h2><p class="small gap">Save your notes, tasks, plans, contacts, bookmarks, and settings in one backup file.</p><div class="row wrap gap"><button class="secondary grow" data-action="export-backup">${icon('download')}Save backup</button><button class="secondary grow" data-action="import-backup">${icon('upload')}Open backup</button></div><p class="kbd-hint">Photos and music stay separate. Keep the original files on your phone.</p></div>${files.length?`<div><h2 class="section-row">Recently chosen</h2><div class="list">${files.map(f=>listItem('files',f.name,f.size?formatBytes(f.size):'Selected file','open-file',f.id)).join('')}</div></div>`:empty('folder','No files chosen yet','Your recently chosen files will appear here.')}</div>`;}
function galleryScreen(){const photos=media.filter(m=>m.kind==='image');return header('Photos','Your selected pictures','gallery')+`<div class="row spread"><p class="small">${photos.length} ${photos.length===1?'photo':'photos'} saved here</p><button class="primary" data-action="pick-image">${icon('plus')}Add photo</button></div><p class="kbd-hint">PocketDesk keeps a smaller copy. Your original stays on your phone.</p>${photos.length?`<div class="gallery-grid">${photos.map(m=>`<button class="photo-tile" data-action="open-photo" data-id="${esc(m.id)}" aria-label="Open ${esc(m.name)}"><img src="${esc(m.url)}" loading="lazy" alt="${esc(m.name)}"></button>`).join('')}</div>`:empty('gallery','Make a little photo collection','Choose the pictures you want to see here.','Add photo','pick-image')}`;}
function photoScreen(){const m=media.find(m=>m.id===current.params.id);if(!m)return empty('gallery','Photo not found','Go back to Photos.');return header('Your photo',m.name,'gallery')+`<div class="content-narrow"><img class="photo-view" src="${esc(m.url)}" alt="${esc(m.name)}"><div class="row gap spread"><span class="small">${formatBytes(m.size||0)} · Saved in PocketDesk</span><button class="secondary" data-action="remove-media" data-id="${esc(m.id)}">${icon('trash')}Remove copy</button></div></div>`;}
function musicScreen(){const tracks=media.filter(m=>m.kind==='audio');if(!view.musicId&&tracks.length)view.musicId=tracks[0].id;const track=tracks.find(m=>m.id===view.musicId)||tracks[0];return header('Music','A small player for your audio files','music')+`<div class="content-narrow"><div class="row spread"><p class="small">${tracks.length} ${tracks.length===1?'track':'tracks'}</p><button class="primary" data-action="pick-audio">${icon('plus')}Add audio</button></div>${track?`<div class="card player gap"><div class="album">${icon('music')}</div><h2>${esc(track.name)}</h2><p class="small gap">${formatBytes(track.size||0)} · Plays while PocketDesk is open</p><input id="music-progress" type="range" min="0" max="1000" value="0" aria-label="Music position"><div class="row full spread media-time"><span id="music-current">00:00</span><span id="music-duration">00:00</span></div><div class="player-controls"><button class="icon-button" data-action="music-prev" aria-label="Previous track">${icon('back')}</button><button id="music-play" class="primary" data-action="music-play" aria-label="Play audio">${icon('play')}</button><button class="icon-button" data-action="music-next" aria-label="Next track">${icon('skip')}</button></div></div><div class="list gap">${tracks.map(m=>`<div class="list-item"><button class="grow row" data-action="select-track" data-id="${esc(m.id)}"><span class="list-icon">${icon('music')}</span><span style="text-align:left"><strong>${esc(m.name)}</strong><small>${view.musicId===m.id?'Selected':'Tap to play'}</small></span></button><button class="icon-button" data-action="remove-media" data-id="${esc(m.id)}" aria-label="Remove ${esc(m.name)}">${icon('trash')}</button></div>`).join('')}</div>`:empty('music','Choose something to listen to','Add an audio file from your phone.','Add audio','pick-audio')}</div>`;}
function contactsScreen(){return header('Contacts','Names and numbers, kept simple','contacts')+`<div class="row spread"><p class="small">Saved in PocketDesk</p><button class="primary" data-action="new-contact">${icon('plus')}Add contact</button></div>${searchField('contacts-search','Find a contact')}<div id="contacts-results">${contactResults('')}</div><button class="secondary full gap" data-action="system" data-id="contacts">Open phone contacts</button>`;}

gRow('sun','Small animations','Off keeps movement to a minimum','toggle-setting','motion',`<span class="toggle ${s.motion?'on':''}" aria-hidden="true"></span>`)}</div><div class="group-label">Your home</div><div class="card settings-group">${settingRow('grid','Choose home apps','Pick up to eight favourites','favorites')}${settingRow('home','Use as your home app','Choose PocketDesk in Android’s home settings','default-home')}${settingRow('files','Back up your data','Save or open a PocketDesk backup','app-files')}${settingRow('lock','Your privacy','Saved locally. No account needed.','privacy')}</div><div class="group-label">Phone settings</div><div class="card settings-group">${settingRow('wifi','Wi-Fi','Open your phone’s Wi-Fi settings','system-setting','wifi')}${settingRow('bluetooth','Bluetooth','Open your phone’s Bluetooth settings','system-setting','bluetooth')}${settingRow('volume','Sound','Open sound and volume settings','system-setting','sound')}${settingRow('sun','Display','Open brightness and display settings','system-setting','display')}${settingRow('settings','All phone settings','Open the normal Android settings','system-setting','settings')}</div><div class="group-label">About</div><div class="card settings-group">${settingRow('device','My phone','Battery, storage, and Android version','app-device')}${settingRow('help','Simple help','A guide to each tool','app-help')}<div class="setting-row"><span class="grow"><strong>PocketDesk 1.0</strong><small>A small Android-style home and toolkit.</small></span></div></div></div>`;}
function formatBytes(n){if(!n)return '0 B';if(n<1024)return n+' B';const units=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++;}while(n>=1024&&i<3);return n.toFixed(n<10?1:0)+' '+units[i];}
function deviceScreen(){refreshDevice();const d=device;if(d.preview)return header('My phone','','device')+empty('device','You are in the browser preview','The Android app can show your phone’s battery, model, and storage.');return header('My phone','Real details from your device','device')+`<div class="stat-grid"><div class="card stat-card">${icon('battery')}<strong>${Number.isFinite(d.battery)?d.battery+'%':'Unknown'}</strong><small>${d.charging?'Charging':'Battery'}</small><div class="meter"><span style="width:${d.battery||0}%"></span></div></div><div class="card stat-card">${icon('device')}<strong>${esc(d.model||'Android phone')}</strong><small>${esc(d.brand||'')}</small></div><div class="card stat-card">${icon('settings')}<strong>Android ${esc(d.android||'')}</strong><small>System version</small></div><div class="card stat-card">${icon('files')}<strong>${formatBytes(d.free||0)}</strong><small>Free space in device data storage</small><div class="meter"><span style="width:${d.total?Math.max(0,Math.min(100,(1-d.free/d.total)*100)):0}%"></span></div></div><div class="card stat-card">${icon('wifi')}<strong>${esc(d.network||'No connection')}</strong><small>Phone network</small></div><div class="card stat-card">${icon('lock')}<strong>On this phone</strong><small>PocketDesk keeps your data local</small></div></div><button class="secondary full gap" data-action="system" data-id="storage">Open phone storage settings</button>`;}
function helpScreen(){return header('Help','Small steps. Simple words.','help')+`<div class="content-narrow"><div class="card"><div class="intro-logo">${icon('home')}</div><h2>Welcome to PocketDesk</h2><p class="small gap">This app is a small home screen and a set of everyday tools. It runs inside Android.</p></div><div class="card gap"><div class="help-line"><h3>Find your way</h3><p>Home takes you to the main screen. Back returns to the previous page. Recent shows tools you opened in PocketDesk. All apps shows the full app menu.</p></div><div class="help-line"><h3>Make it yours</h3><p>Open Settings. Choose a theme, colour, background, and text size. Choose home apps lets you pick your favourite tools.</p></div><div class="help-line"><h3>Notes and tasks</h3><p>Notes save as you type. Deleted notes go to Trash first. In Tasks, tap a box when you finish a task. Tap the task name to edit it.</p></div><div class="help-line"><h3>Your calendar</h3><p>Tap a day, then Add plan. Plans stay in PocketDesk. They do not sync with your phone calendar or create reminder alerts.</p></div><div class="help-line"><h3>Clock and alerts</h3><p>The clock uses 24-hour time. The stopwatch remembers its start time. The small timer alerts while PocketDesk is open. Use Set a phone alarm or Open phone timer for an alert after you close the app.</p></div><div class="help-line"><h3>Photos, music, and files</h3><p>You choose each file. PocketDesk stores a smaller copy of a photo and a full copy of an audio file. Removing a copy here keeps the original on your phone. Music pauses when you leave PocketDesk.</p></div><div class="help-line"><h3>Phone and internet</h3><p>Phone, Messages, Camera, Internet, and phone settings open your phone’s own apps. You choose when to call or send a message. Your phone needs a connection for websites.</p></div><div class="help-line"><h3>Keep a backup</h3><p>Open Files, then Save backup. Choose where to save the file. Photos and audio are separate. Opening a backup replaces the lists and settings after you confirm.</p></div><div class="help-line"><h3>Use PocketDesk as your home</h3><p>Open Settings, then Use as your home app. Choose PocketDesk. To go back, open Android Settings, search for Default apps, then choose your old Home app.</p></div><div class="help-line" style="margin-bottom:0"><h3>Your privacy</h3><p>PocketDesk has no account, adverts, tracking, or internet permission. It saves data in its private space. Deleting the app also removes that data. Save a backup first.</p></div></div><button class="primary full gap" data-action="home">${icon('home')}Go home</button></div>`;}
function recentScreen(){return header('Recent','Tools you opened in PocketDesk','recent')+(state.recents.length?`<div class="content-narrow stack">${state.recents.map(id=>{const a=appById(id);return `<div class="card recent-card"><div class="row"><span class="badge-icon">${icon(id)}</span><div class="grow"><h2>${a.name}</h2><p class="small">${a.hint}</p></div><button class="primary" data-action="app" data-id="${id}">Open</button></div><div class="recent-preview">${id==='notes'?state.notes.filter(n=>!n.deleted).length+' saved notes':id==='tasks'?state.tasks.filter(t=>!t.done).length+' open tasks':id==='calendar'?state.events.length+' saved plans':'Ready to open'}</div></div>`;}).join('')}<button class="secondary full" data-action="clear-recents">Clear this list</button><p class="small center">This list does not close your phone’s running apps.</p></div>`:empty('recent','Nothing here yet','Open a PocketDesk tool and it will appear here.'));}
function searchScreen(){return header('Find something','Apps, notes, tasks, plans, and contacts','search')+searchField('global-search','Type a name or word')+'<div id="global-results">'+globalResults('')+'</div>';}
function globalResults(query){const q=query.toLowerCase().trim();if(!q)return `<div class="app-grid">${apps.slice(0,8).map(a=>tile(a)).join('')}</div>`;const groups=[['Apps',apps.filter(a=>(a.name+' '+a.hint).toLowerCase().includes(q)).map(a=>listItem(a.id,a.name,a.hint,'app',a.id))],['Notes',state.notes.filter(n=>!n.deleted&&(n.title+' '+n.body).toLowerCase().includes(q)).slice(0,10).map(n=>listItem('notes',n.title||'Untitled note',n.body.slice(0,65),'open-note',n.id))],['Tasks',state.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,10).map(t=>listItem('tasks',t.title,t.done?'Done':'Open','edit-task',t.id))],['Plans',state.events.filter(e=>e.title.toLowerCase().includes(q)).slice(0,10).map(e=>listItem('calendar',e.title,dateLabel(e.date),'open-event',e.id))],['Contacts',state.contacts.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)).slice(0,10).map(c=>listItem('contacts',c.name,c.phone,'open-contact',c.id))]];return groups.some(g=>g[1].length)?groups.filter(g=>g[1].length).map(([title,list])=>`<h2 class="overline">${title}</h2><div class="list">${list.join('')}</div>`).join(''):empty('search','No matches yet','Try a shorter word or another name.');}
function openSheet(title,body){if(!overlayOpen)focusBeforeSheet=document.activeElement;overlayOpen=true;$('overlay').hidden=false;$('overlay').innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-button" data-action="close-sheet" aria-label="Close">${icon('close')}</button></div><div class="sheet-body">${body}</div></section>`;$('shell').inert=true;const first=$('overlay').querySelector('input:not([type=checkbox]),textarea');setTimeout(()=>{if(overlayOpen)(first||$('overlay').querySelector('button'))?.focus();},80);}
function closeSheet(){if(!overlayOpen)return;overlayOpen=false;$('overlay').hidden=true;$('overlay').innerHTML='';$('shell').inert=false;if(focusBeforeSheet&&document.contains(focusBeforeSheet))focusBeforeSheet.focus();focusBeforeSheet=null;}

function quickSheet(){openSheet('Quick settings',`<div class="quick-grid"><button class="quick-tile" data-action="system" data-id="wifi">${icon('wifi')}<strong>Wi-Fi</strong><small>Open phone setting</small></button><button class="quick-tile" data-action="system" data-id="bluetooth">${icon('bluetooth')}<strong>Bluetooth</strong><small>Open phone setting</small></button><button class="quick-tile ${document.body.dataset.theme==='dark'?'active':''}" data-action="quick-theme">${icon('moon')}<strong>Dark theme</strong><small>${document.body.dataset.theme==='dark'?'On · Tap for light':'Off · Tap for dark'}</small></button><button class="quick-tile ${state.settings.textSize>100?'active':''}" data-action="quick-text">${icon('text')}<strong>Large text</strong><small>${state.settings.textSize>100?'On':'Off'}</small></button></div><div class="card gap"><label class="label" for="quick-brightness">${N?'Screen brightness in this app':'Phone brightness'}</label>${N?`<input id="quick-brightness" type="range" min="20" max="100" value="${native('getBrightness')||70}" aria-label="Screen brightness in this app">`:`<p class="small">Available in the Android app.</p>`}<label class="label gap" for="quick-volume">Media volume</label>${N?`<input id="quick-volume" type="range" min="0" max="100" value="${native('getVolume')||0}" aria-label="Media volume">`:`<p class="small">Available in the Android app.</p>`}</div><button class="secondary full gap" data-action="quick-settings">${icon('settings')}All settings</button>`);}
function phoneAction(action,...args){if(!N){toast('This opens your phone’s app in the Android version.');return;}native(action,...args);}
function exportText(name,data,mime='text/plain'){if(N){native('exportDocument',name,data,mime);return;}const url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Your download is ready.');}
function pick(type){if(N){native('pickDocument',type);return;}pendingFileType=type;const input=$('file-input');input.accept=type==='image'?'image/*':type==='audio'?'audio/*':type==='backup'?'.json,application/json':'*/*';input.value='';input.click();}
function receiveBackup(data){try{if(data.length>2000000)throw new Error('This backup is too large.');pendingBackup=C.cleanState(JSON.parse(data),true);confirm('Open this backup?',`This replaces your current notes, tasks, plans, contacts, bookmarks, and settings. The backup contains ${pendingBackup.notes.length} notes, ${pendingBackup.tasks.length} tasks, and ${pendingBackup.events.length} plans.`,'restore-backup','','Restore');}catch(e){toast(e.message==='Unexpected end of JSON input'?'The file could not be read.':e.message.startsWith('This')||e.message.startsWith('The backup')?e.message:'This is not a valid PocketDesk backup.');}}
function playTrack(id){const t=media.find(m=>m.kind==='audio'&&m.id===id);if(!t)return;view.musicId=id;const a=$('music-audio');if(a.dataset.id!==id){a.src=t.url;a.dataset.id=id;}a.play().catch(()=>toast('This audio file could not play. Try another file.'));if(current.id==='music')render(true);}
function nextTrack(delta){const tracks=media.filter(m=>m.kind==='audio');if(!tracks.length)return;const i=tracks.findIndex(t=>t.id===view.musicId);playTrack(tracks[(i+delta+tracks.length)%tracks.length].id);}
function updateAudioUI(){const a=$('music-audio'),play=$('music-play');if(play){play.innerHTML=icon(a.paused?'play':'pause');play.setAttribute('aria-label',a.paused?'Play audio':'Pause audio');}if($('music-current'))$('music-current').textContent=C.duration(a.currentTime*1000||0);if($('music-duration'))$('music-duration').textContent=C.duration(Number.isFinite(a.duration)?a.duration*1000:0);if($('music-progress')&&Number.isFinite(a.duration))$('music-progress').value=String(a.duration?a.currentTime/a.duration*1000:0);}

function openWebsite(url){const safe=C.safeUrl(url,false);if(!safe){toast('Use a normal website address.');return;}if(N)native('openWebsite',safe);else{const a=document.createElement('a');a.href=safe;a.target='_blank';a.rel='noopener noreferrer';a.click();}}

$('file-input').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(pendingFileType==='backup'){if(f.size>8000000){toast('This backup is too large.');return;}receiveBackup(await f.text());}else if(pendingFileType==='image'){if(!f.type.startsWith('image/')){toast('Choose an image file.');return;}if(f.size>30000000){toast('Choose a photo smaller than 30 MB.');return;}const url=URL.createObjectURL(f);previewMedia.push({id:C.id(),name:f.name,kind:'image',url,size:f.size});refreshMedia();if(current.id==='gallery')render(true);toast('Added for this preview session.');}else if(pendingFileType==='audio'){if(!f.type.startsWith('audio/')){toast('Choose an audio file.');return;}if(f.size>100000000){toast('Choose an audio file smaller than 100 MB.');return;}previewMedia.push({id:C.id(),name:f.name,kind:'audio',url:URL.createObjectURL(f),size:f.size});refreshMedia();if(current.id==='music')render(true);toast('Added for this preview session.');}else if(f.type.startsWith('text/')&&f.size<1000000){openSheet(f.name,`<pre class="detail-text small">${esc(await f.text())}</pre>`);}else toast('File chosen: '+f.name+'. Opening it in another app needs the Android version.');});
